<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>staged</title>
  <link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="brand/staged-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="staged">
  <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <link rel="preload" href="fonts/Akt-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <a class="brand" href="#repo=all&amp;view=week" id="brandHome" title="Home"><svg class="brand-mark" viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M18 18H6C5.05719 18 4.58579 18 4.29289 17.7071C4 17.4142 4 16.9428 4 16C4 15.0572 4 14.5858 4.29289 14.2929C4.58579 14 5.05719 14 6 14H18C18.9428 14 19.4142 14 19.7071 14.2929C20 14.5858 20 15.0572 20 16C20 16.9428 20 17.4142 19.7071 17.7071C19.4142 18 18.9428 18 18 18Z" fill="var(--logo-box)" fill-opacity=".18" stroke="var(--logo-box)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 10H20" stroke="var(--logo-2)" stroke-width="1.75" stroke-linecap="round"/><path d="M4 6H20" stroke="var(--logo-1)" stroke-width="1.75" stroke-linecap="round"/></svg><span class="brand-word">staged</span></a>
      <nav class="repos scroll-fade-x" id="repos" aria-label="Repositories"></nav>
      <div class="side-links"><button class="side-link" id="settingsLink" type="button"></button><button class="side-link" id="readmeLink" type="button"></button></div>
    </aside>

    <main class="main">
      <header class="head">
        <div class="head-title">
          <h1 id="title">All repos</h1>
          <div class="head-meta mono" id="meta"></div>
        </div>
        <div class="head-actions">
          <button class="push-btn run-btn" id="runBtn" hidden title="Run this project"></button>
          <button class="push-btn" id="pushBtn" hidden title="Push your commits"></button>
          <a class="icon-btn" id="ghLink" target="_blank" rel="noopener" hidden title="Open the repo online"></a>
          <button class="icon-btn" id="projectBtn" hidden title="Project settings" aria-label="Project settings"></button>
        </div>
      </header>

      <div class="controls">
        <div class="seg scroll-fade-x" id="viewSeg" role="tablist" aria-label="Group changes">
          <button data-v="week" role="tab">Weeks</button>
          <button data-v="feature" role="tab">Features</button>
          <button data-v="release" role="tab">Releases</button>
          <button data-v="tree" role="tab">Tree</button>
          <button data-v="commit" role="tab">Commit <span class="count mono" id="dirtyCount"></span></button>
        </div>
        <div class="seg scroll-fade-x" id="rangeSeg" aria-label="Time range">
          <button data-r="4w">4w</button>
          <button data-r="12w">12w</button>
          <button data-r="1y">1y</button>
          <button data-r="all">All</button>
        </div>
        <button class="text-btn" id="copyRange" title="Copy this range as release notes (Markdown)"></button>
        <label class="search">
          <span id="searchIcon"></span>
          <input id="q" type="search" placeholder="Search" autocomplete="off" spellcheck="false">
        </label>
      </div>

      <section class="home" id="home" hidden></section>

      <section class="stats" id="stats" aria-label="Summary"></section>

      <section class="chart-card">
        <div class="chart-head">
          <h2 id="chartTitle">Commits per week</h2>
          <div class="legend" id="legend"></div>
        </div>
        <div class="chart" id="chart"></div>
      </section>

      <section id="list" class="list"></section>
    </main>
  </div>
  <div class="tip" id="tip" role="tooltip" hidden></div>
  <div class="toast mono" id="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
